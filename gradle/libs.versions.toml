[versions]
agp                    = "9.1.1"
kotlin                 = "2.2.10"
ksp                    = "2.3.2"
compose                = "1.9.3"          # Compose Multiplatform
coreKtx                = "1.13.1"
lifecycleRuntimeKtx    = "2.8.7"
activityCompose        = "1.9.3"
composeBom             = "2024.11.00"
navigationCompose      = "2.9.0-beta03"           # JetBrains KMP fork — matches CMP 1.9.3 / Kotlin 2.1.20
lifecycleViewmodelCompose = "2.9.6"          # JetBrains Lifecycle fork — matches CMP 1.9.3
savedstate             = "1.3.1"          # JetBrains SavedState fork — matches CMP 1.9.3
room                   = "2.7.0"          # Room-KMP (iOS support)
coroutines             = "1.9.0"
datastore              = "1.1.1"
gson                   = "2.10.1"
coil                   = "3.0.4"          # Coil 3 (multiplatform)
koin                   = "4.1.0"
kotlinxSerialization   = "1.7.3"
kotlinxDatetime        = "0.6.0"
ktor                   = "3.1.0"          # must match coil-network-ktor3's transitive ktor version
profileinstaller       = "1.4.1"
pdfbox-android         = "2.0.27.0"
apache-poi             = "5.3.0"

[libraries]
# AndroidX core
androidx-core-ktx                  = { group = "androidx.core",          name = "core-ktx",                     version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx     = { group = "androidx.lifecycle",     name = "lifecycle-runtime-ktx",         version.ref = "lifecycleRuntimeKtx" }
androidx-activity-compose          = { group = "androidx.activity",       name = "activity-compose",              version.ref = "activityCompose" }
# Compose
androidx-compose-bom               = { group = "androidx.compose",       name = "compose-bom",                   version.ref = "composeBom" }
androidx-ui                        = { group = "androidx.compose.ui",    name = "ui" }
androidx-ui-graphics               = { group = "androidx.compose.ui",    name = "ui-graphics" }
androidx-ui-tooling                = { group = "androidx.compose.ui",    name = "ui-tooling" }
androidx-ui-tooling-preview        = { group = "androidx.compose.ui",    name = "ui-tooling-preview" }
androidx-ui-test-manifest          = { group = "androidx.compose.ui",    name = "ui-test-manifest" }
androidx-ui-test-junit4            = { group = "androidx.compose.ui",    name = "ui-test-junit4" }
androidx-material3                 = { group = "androidx.compose.material3", name = "material3" }
androidx-material-icons-extended   = { group = "androidx.compose.material", name = "material-icons-extended" }
# Navigation (KMP)
androidx-navigation-compose        = { group = "org.jetbrains.androidx.navigation", name = "navigation-compose", version.ref = "navigationCompose" }
# Lifecycle / ViewModel (KMP)
androidx-lifecycle-viewmodel       = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel",          version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-viewmodel-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-viewmodel-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime-compose = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime-compose", version.ref = "lifecycleViewmodelCompose" }
androidx-lifecycle-runtime         = { group = "org.jetbrains.androidx.lifecycle", name = "lifecycle-runtime",         version.ref = "lifecycleViewmodelCompose" }
androidx-savedstate                = { group = "org.jetbrains.androidx.savedstate", name = "savedstate",                  version.ref = "savedstate" }
# Room KMP
androidx-room-runtime              = { group = "androidx.room",          name = "room-runtime",                  version.ref = "room" }
androidx-room-compiler             = { group = "androidx.room",          name = "room-compiler",                 version.ref = "room" }
# SQLite bundled driver (cross-platform)
androidx-sqlite-bundled            = { group = "androidx.sqlite",        name = "sqlite-bundled",                version = "2.5.0" }
# DataStore KMP
androidx-datastore-preferences-core = { group = "androidx.datastore",   name = "datastore-preferences-core",    version.ref = "datastore" }
# Coroutines
kotlinx-coroutines-core            = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-core",       version.ref = "coroutines" }
kotlinx-coroutines-android         = { group = "org.jetbrains.kotlinx",  name = "kotlinx-coroutines-android",    version.ref = "coroutines" }
# kotlinx-serialization
kotlinx-serialization-json         = { group = "org.jetbrains.kotlinx",  name = "kotlinx-serialization-json",    version.ref = "kotlinxSerialization" }
# kotlinx-datetime
kotlinx-datetime                   = { group = "org.jetbrains.kotlinx",  name = "kotlinx-datetime",              version.ref = "kotlinxDatetime" }
# Koin
koin-core                          = { group = "io.insert-koin",         name = "koin-core",                     version.ref = "koin" }
koin-android                       = { group = "io.insert-koin",         name = "koin-android",                  version.ref = "koin" }
koin-compose                       = { group = "io.insert-koin",         name = "koin-compose",                  version.ref = "koin" }
koin-compose-viewmodel             = { group = "io.insert-koin",         name = "koin-compose-viewmodel",        version.ref = "koin" }
# Coil 3 (KMP)
coil-compose                       = { group = "io.coil-kt.coil3",       name = "coil-compose",                  version.ref = "coil" }
coil-network-okhttp                = { group = "io.coil-kt.coil3",       name = "coil-network-okhttp",           version.ref = "coil" }
coil-network-ktor3                 = { group = "io.coil-kt.coil3",       name = "coil-network-ktor3",            version.ref = "coil" }
# Gson (Android only, kept for compat)
gson                               = { group = "com.google.code.gson",   name = "gson",                          version.ref = "gson" }
# Ktor (for future download service)
ktor-client-core                   = { group = "io.ktor",                name = "ktor-client-core",              version.ref = "ktor" }
ktor-client-okhttp                 = { group = "io.ktor",                name = "ktor-client-okhttp",            version.ref = "ktor" }
ktor-client-darwin                 = { group = "io.ktor",                name = "ktor-client-darwin",            version.ref = "ktor" }
androidx-profileinstaller          = { group = "androidx.profileinstaller", name = "profileinstaller",           version.ref = "profileinstaller" }
# Document parsing (Android only)
pdfbox-android                     = { group = "com.tom-roush",             name = "pdfbox-android",                version.ref = "pdfbox-android" }
apache-poi-ooxml                   = { group = "org.apache.poi",            name = "poi-ooxml",                     version.ref = "apache-poi" }
# Test
junit                              = { group = "junit",                  name = "junit",                         version = "4.13.2" }
androidx-junit                     = { group = "androidx.test.ext",      name = "junit",                         version = "1.2.1" }
androidx-espresso-core             = { group = "androidx.test.espresso", name = "espresso-core",                 version = "3.6.1" }

[plugins]
android-application  = { id = "com.android.application",               version.ref = "agp" }
android-library      = { id = "com.android.library",                   version.ref = "agp" }
kotlin-android       = { id = "org.jetbrains.kotlin.android",          version.ref = "kotlin" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform",    version.ref = "kotlin" }
kotlin-compose       = { id = "org.jetbrains.kotlin.plugin.compose",   version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
compose-multiplatform = { id = "org.jetbrains.compose",               version.ref = "compose" }
ksp                  = { id = "com.google.devtools.ksp",               version.ref = "ksp" }
